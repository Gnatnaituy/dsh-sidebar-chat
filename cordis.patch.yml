# dsh-sidebar-chat 的 bundle 补丁层。
#
# 一行同时服务于包的两半：
#   - Loader 把包 main（lib/index.js，host 半，原生 Cordis 插件）当作普通 host
#     插件行导入：注册 `/dsh-sidebar-chat/*` 路由，负责模型列表、聊天流、附件
#     落盘与会话历史；
#   - web client 模块系统（dsh-client-modules）看到同一行，解析包的
#     `dsh.client` 声明，并把 exports["./client"]（lib/client.js）服务到
#     /plugins/dsh-sidebar-chat/client.js。
#
# 行名必须与包名完全一致：这是 Loader 解析包、以及 client-modules 扫描器查找
# package.json 时使用的键。
#
# 注意：本文件只在包被列进 profile 的 `dsh.profile.bundles` 时才生效。如果改用
# profile 自己的 cordis.patch.yml 手写同一行（tools/install-into-profile.mjs 走
# 的就是这条路），请不要同时把包加进 bundles —— 两处都会 insert 同一 id，
# Loader 会报重复条目。
- insert:
    - id: sidebar-chat
      name: dsh-sidebar-chat
